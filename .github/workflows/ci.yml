name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps for pyresidfp + ALSA tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check preframr_audio tests
      - name: pylint
        run: pylint preframr_audio tests
      - name: pyright
        run: pyright preframr_audio
      - name: pytest + coverage (>= 85%)
        run: pytest --cov=preframr_audio --cov-report=term-missing --cov-fail-under=85
