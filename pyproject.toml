[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "preframr-audio"
description = "SID audio rendering primitives extracted from the preframr research codebase."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anarkiwi"}]
keywords = ["sid", "c64", "audio", "pyresidfp", "preframr"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "pyresidfp>=0.17",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "coverage>=7",
    "pandas>=2",
    "pylint>=3",
    "pyright>=1.1",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/anarkiwi/preframr-audio"
Source = "https://github.com/anarkiwi/preframr-audio"
Issues = "https://github.com/anarkiwi/preframr-audio/issues"

[tool.setuptools]
packages = ["preframr_audio"]

[tool.setuptools_scm]
fallback_version = "0.5.5"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
branch = true
source = ["preframr_audio"]
omit = [
    "preframr_audio/__init__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = [
    "E501",
    "E741",
    "B008",
]

[tool.pylint.main]
disable = "all"
enable = [
    "redefined-builtin",
    "unused-import",
    "unused-argument",
    "cell-var-from-loop",
    "unused-variable",
    "unbalanced-tuple-unpacking",
    "stop-iteration-return",
    "reimported",
    "dangerous-default-value",
    "pointless-statement",
    "using-constant-test",
    "raise-missing-from",
]
